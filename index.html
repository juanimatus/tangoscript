<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TangoScript</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="alternate" hreflang="es" href="https://tangoscript.vercel.app/es/">
<link rel="alternate" hreflang="en" href="https://tangoscript.vercel.app/en/">
<link rel="alternate" hreflang="x-default" href="https://tangoscript.vercel.app/en/">
<script>
(function(){
  var elegido=null; try{elegido=localStorage.getItem('ts-idioma')}catch(e){}
  var langs=navigator.languages||[navigator.language||'en'];
  var es=elegido?elegido==='es':langs.some(function(l){return /^es/i.test(l)});
  location.replace(es?'es/':'en/');
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071322;color:#fff;font:16px system-ui,sans-serif}a{color:#f2edda;margin:0 10px}</style>
</head>
<body>
<p><a href="es/">Español</a> <a href="en/">English</a></p>
</body>
</html>
